android {
    signingConfigs {
        debug {
            storeFile file('hanana.jks')
            storePassword '12345678q'
            keyPassword '12345678q'
            keyAlias 'hananaapps'
            enableV3Signing true
            enableV3Signing true
            enableV3Signing true
            enableV4Signing true
        }
        release {
            storeFile file('hanana.jks')
            storePassword '12345678q'
            keyPassword '12345678q'
            keyAlias 'hananaapps'
            enableV3Signing true
            enableV3Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    namespace 'org.eu.hanana.reimu.ottohub_andriod'
    compileSdk = 36

    defaultConfig {
        android.buildFeatures.buildConfig = true
        applicationId "org.eu.hanana.reimu.ottohub_andriod"
        minSdk 23
        multiDexEnabled true
        multiDexKeepProguard file("tinker_multidexkeep.pro")
        targetSdk 36
        versionCode 299
        versionName "2.9.9_Code.Tenshi"
        resConfigs "en", "zh" // Example: Support English and Spanish
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format("yyyy-MM-dd HH:mm:ss")}\""
        def gitCommit = "unknown"
        try {
            def stdout = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                standardOutput = stdout
            }
            gitCommit = stdout.toString().trim()
        } catch (Exception e) {
            // ignore，没git时使用默认值
        }
        versionName=versionName+"_Git."+gitCommit
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit}\""
        buildConfigField "String", "TINKER_ID", "\"${getTinkerIdValue()}\""
        buildConfigField "String", "PLATFORM", "\"all\""
        buildConfigField "String", "MESSAGE", "\"I am the base apk\""
    }
    dexOptions {
        jumboMode = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // 如果发现其他重复文件，继续添加排除规则
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/LICENSE-LGPL-2.1.txt'
        exclude 'META-INF/LICENSE-LGPL-3.txt'
        exclude 'META-INF/LICENSE-W3C-TEST'
        exclude 'META-INF/DEPENDENCIES'
    }
    buildFeatures {
        viewBinding true
        aidl true
    }
    androidResources{
        generateLocaleConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
